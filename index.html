<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIZMY MEDIKA — Sistem Klinik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F7F6F2;
    --surface:#FFFFFF;
    --surface-alt:#EFEDE6;
    --ink:#1C2420;
    --ink-soft:#5B655F;
    --ink-faint:#8B948D;
    --teal:#7C9473;
    --teal-dark:#4A5A40;
    --teal-soft:#E7EDE1;
    --amber:#E2963C;
    --amber-soft:#FBEDD9;
    --red:#C0453A;
    --red-soft:#FBE7E4;
    --border:#DEDAD0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    margin:0;
    color:var(--teal-dark);
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Login screen ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--teal-dark);
  }
  .login-card{
    background:var(--surface);border-radius:14px;padding:34px 32px;width:100%;max-width:360px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .login-mark{
    width:44px;height:44px;border-radius:10px;background:var(--amber);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--teal-dark);
    margin-bottom:14px;
  }
  .login-card h1{font-size:19px;}
  .login-card .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;margin-bottom:22px;}
  .login-error{
    background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 12px;
    font-size:12.5px;margin-bottom:14px;display:none;
  }
  .login-error.show{display:block;}

  /* ---------- App shell ---------- */
  .app{min-height:100vh;display:flex;flex-direction:column;display:none;}
  .app.show{display:flex;}

  .topbar{
    background:var(--teal-dark);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    position:sticky;
    top:0;
    z-index:200;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:32px;height:32px;border-radius:8px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:var(--teal-dark);
    font-size:16px;
  }
  .brand-name{font-family:'Space Grotesk';font-weight:600;font-size:16px;color:#fff;}
  .brand-sub{font-size:11px;color:#B9CBC7;margin-top:-2px;}

  .user-chip{display:flex;align-items:center;gap:10px;}
  .super-switch{display:flex;gap:4px;background:rgba(255,255,255,0.08);padding:4px;border-radius:10px;}
  .super-switch button{
    border:none;background:transparent;color:#C7D6D3;padding:7px 13px;border-radius:7px;
    font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s, color .15s;
  }
  .super-switch button.active{background:var(--amber);color:var(--teal-dark);}
  .super-switch button:hover:not(.active){background:rgba(255,255,255,0.12);}
  .user-chip .info{text-align:right;}
  .user-chip .name{font-size:13px;font-weight:600;color:#fff;}
  .user-chip .role{font-size:11px;color:#B9CBC7;text-transform:capitalize;}
  .user-chip button{
    border:none;background:rgba(255,255,255,0.1);color:#fff;padding:8px 13px;
    border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .user-chip button:hover{background:rgba(255,255,255,0.18);}

  .layout{flex:1;display:flex;min-height:0;}

  .sidebar{
    width:220px;background:var(--surface);border-right:1px solid var(--border);
    padding:18px 12px;flex-shrink:0;
  }
  .sidebar-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
    padding:0 10px;margin-bottom:8px;font-weight:600;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;
    font-size:14px;font-weight:500;color:var(--ink-soft);cursor:pointer;margin-bottom:2px;
    border:none;background:none;width:100%;text-align:left;
  }
  .nav-item:hover{background:var(--surface-alt);}
  .nav-item.active{background:var(--teal-soft);color:var(--teal-dark);font-weight:600;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0;}

  .main{flex:1;padding:26px 30px;overflow-y:auto;}

  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:22px;}
  .page-head p{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;
  }
  .card h3{font-size:14.5px;margin-bottom:12px;}

  /* ---------- Queue board ---------- */
  .queue-board{
    background:var(--teal-dark);
    border-radius:14px;
    padding:20px 22px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:22px;
  }
  .queue-slot{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    padding:14px 16px;
  }
  .queue-slot .poli-name{color:#9FC0BA;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .queue-slot .now-serving{
    font-family:'IBM Plex Mono';font-weight:700;font-size:34px;color:var(--amber);
    line-height:1.1;margin-top:6px;
  }
  .queue-slot .waiting-count{color:#B9CBC7;font-size:12px;margin-top:4px;}

  /* ---------- Tables / lists ---------- */
  .list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
  .list-row{
    display:flex;align-items:center;gap:14px;padding:13px 16px;
    border-bottom:1px solid var(--border);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--surface-alt);}
  .queue-num{
    font-family:'IBM Plex Mono';font-weight:700;font-size:15px;color:var(--teal-dark);
    background:var(--teal-soft);border-radius:6px;padding:4px 9px;min-width:34px;text-align:center;
  }
  .row-main{flex:1;min-width:0;}
  .row-name{font-weight:600;font-size:14px;}
  .row-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .badge{
    font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;
  }
  .badge-wait{background:var(--surface-alt);color:var(--ink-soft);}
  .badge-called{background:var(--amber-soft);color:#9A5F16;}
  .badge-done{background:var(--teal-soft);color:var(--teal-dark);}
  .badge-unpaid{background:var(--red-soft);color:var(--red);}
  .badge-paid{background:var(--teal-soft);color:var(--teal-dark);}

  .btn{
    border:none;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:600;
    cursor:pointer;transition:opacity .15s; display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-amber{background:var(--amber);color:var(--teal-dark);}
  .btn-amber:hover{opacity:.9;}
  .btn-ghost{background:var(--surface-alt);color:var(--ink);}
  .btn-ghost:hover{background:var(--border);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}

  /* ---------- Forms ---------- */
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
  input,select,textarea{
    width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 11px;
    font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  textarea{resize:vertical;min-height:64px;}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---------- Allergy banner ---------- */
  .allergy-banner{
    background:var(--red-soft);border:1px solid #EFC3BD;border-radius:9px;
    padding:12px 15px;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;
  }
  .allergy-banner .icon{
    width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .allergy-banner .title{font-weight:700;color:var(--red);font-size:13.5px;}
  .allergy-banner .items{font-size:13px;color:#7A2E27;margin-top:2px;}
  .allergy-none{
    background:var(--surface-alt);border:1px solid var(--border);border-radius:9px;
    padding:10px 15px;font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;
  }

  .section-title{
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--teal-dark);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--border);
  }
  .section-title:first-of-type{border-top:none;margin-top:0;padding-top:0;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:13.5px;}
  .loading{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:13.5px;}

  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .stat-card .num{font-family:'IBM Plex Mono';font-weight:700;font-size:26px;color:var(--teal-dark);}
  .stat-card .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .rx-item{display:flex;gap:10px;align-items:center;background:var(--surface-alt);border-radius:7px;padding:8px 10px;margin-bottom:6px;}
  .rx-item span{font-size:13px;}
  .rx-item .rx-name{font-weight:600;flex:1;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--teal-dark);color:#fff;
    padding:12px 18px;border-radius:9px;font-size:13.5px;font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);opacity:0;transform:translateY(10px);
    transition:all .25s;pointer-events:none;z-index:50;max-width:320px;
  }
  .toast.show{opacity:1;transform:none;}

  .poli-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .poli-tab{
    border:1px solid var(--border);background:var(--surface);border-radius:8px;
    padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .poli-tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  @media (max-width:860px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;display:flex;overflow-x:auto;gap:4px;padding:10px 12px;border-right:none;border-bottom:1px solid var(--border);}
    .sidebar-label{display:none;}
    .nav-item{width:auto;white-space:nowrap;}
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .queue-board{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ============================================================
     LOGIN SCREEN
     ============================================================ -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-mark">✚</div>
    <h1>RIZMY MEDIKA</h1>
    <div class="sub">Masuk dengan akun staff klinik Anda</div>
    <div class="login-error" id="loginError"></div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="nama@klinik.com"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password" placeholder="••••••••"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">✚</div>
      <div>
        <div class="brand-name">RIZMY MEDIKA</div>
        <div class="brand-sub">Beyond Medical Care</div>
      </div>
    </div>
    <div class="super-switch" id="superSwitch" style="display:none;"></div>
    <div class="user-chip">
      <div class="info">
        <div class="name" id="userName">—</div>
        <div class="role" id="userRole">—</div>
      </div>
      <button onclick="doLogout()">Keluar</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-label">Menu</div>
      <div id="sidebarNav"></div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   KONFIGURASI SUPABASE
   Ganti dua nilai ini kalau kamu pindah project Supabase.
   ========================================================= */
const SUPABASE_URL = 'https://qekcesbnhexcfbyswtdu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8LMzIiMHoRV2TwvPCR7MWA_vZRMFp_1';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Poli tetap (id harus sama dengan yang di-insert di skema_klinik_supabase.sql) */
const POLI = [
  {id:1, kode:'kandungan', nama:'Kebidanan & Kandungan'},
  {id:2, kode:'mata', nama:'Mata'},
  {id:3, kode:'gigi', nama:'Gigi'},
];
function poliById(id){ return POLI.find(p=>p.id===id); }

let currentStaff = null;   // baris dari tabel staff untuk user yang login
let ui = {
  role: null,
  petugasView: 'antrian',
  dokterView: 'antrian',
  kasirView: 'tunggu',
  adminView: 'staff',
  activeVisitId: null,
};
let cache = { patients: [], visits: [], dokters: [] };
let daftarState = { patientId: null };

/* =========================================================
   HELPERS
   ========================================================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return (s==null?'':s).toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtRp(n){ return 'Rp' + (n||0).toLocaleString('id-ID'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function parseTensi(str){
  const parts = (str||'').split('/').map(s=>parseInt(s.trim(),10));
  return { sistol: isNaN(parts[0])?null:parts[0], diastol: isNaN(parts[1])?null:parts[1] };
}
function parseBbTb(str){
  const parts = (str||'').split('/').map(s=>parseFloat(s.trim()));
  return { bb: isNaN(parts[0])?null:parts[0], tb: isNaN(parts[1])?null:parts[1] };
}

/* =========================================================
   LOGIN / LOGOUT
   ========================================================= */
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.classList.remove('show');
  if(!email || !password){ errBox.textContent='Email dan password wajib diisi.'; errBox.classList.add('show'); return; }

  document.getElementById('loginBtn').textContent = 'Memproses...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  document.getElementById('loginBtn').textContent = 'Masuk';

  if(error){ errBox.textContent = 'Login gagal: ' + error.message; errBox.classList.add('show'); return; }
  await loadCurrentStaff();
}

async function loadCurrentStaff(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return;
  const { data, error } = await sb.from('staff').select('*').eq('auth_user_id', user.id).eq('aktif', true).maybeSingle();
  const errBox = document.getElementById('loginError');
  if(error || !data){
    errBox.textContent = 'Akun ini belum terhubung ke data staff klinik. Hubungi admin untuk didaftarkan.';
    errBox.classList.add('show');
    await sb.auth.signOut();
    return;
  }
  currentStaff = data;
  ui.role = data.role;
  enterApp();
}

async function doLogout(){
  await sb.auth.signOut();
  currentStaff = null;
  ui.activeVisitId = null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('userName').textContent = currentStaff.nama;
  const poliLabel = currentStaff.poli_id ? ' · ' + poliById(currentStaff.poli_id).nama : '';
  document.getElementById('userRole').textContent = currentStaff.role + poliLabel;

  if(currentStaff.role === 'superadmin'){
    ui.superRole = ui.superRole || 'admin';
    ui.superDokterPoli = ui.superDokterPoli || POLI[0].id;
    renderSuperSwitch();
  }
  renderSidebar();
  renderMain();
}

/* Kalau superadmin, dia bisa "bertindak sebagai" role apa saja.
   Untuk role lain (petugas/dokter/kasir/admin), role-nya tetap. */
function effectiveRole(){
  return currentStaff.role === 'superadmin' ? ui.superRole : currentStaff.role;
}
const SUPER_ROLES = [
  {id:'petugas', label:'Petugas'}, {id:'dokter', label:'Dokter'},
  {id:'kasir', label:'Kasir'}, {id:'admin', label:'Admin'},
];
function renderSuperSwitch(){
  const el = document.getElementById('superSwitch');
  el.style.display = 'flex';
  el.innerHTML = SUPER_ROLES.map(r=>`<button class="${ui.superRole===r.id?'active':''}" onclick="setSuperRole('${r.id}')">${r.label}</button>`).join('');
}
function setSuperRole(role){
  ui.superRole = role;
  ui.activeVisitId = null;
  renderSuperSwitch();
  renderSidebar();
  renderMain();
}

/* Cek sesi yang masih aktif saat halaman dibuka ulang */
(async function initSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session) await loadCurrentStaff();
})();

/* =========================================================
   SIDEBAR / NAV
   ========================================================= */
const NAVS = {
  petugas: [ {id:'antrian', label:'Antrian Hari Ini'}, {id:'daftar', label:'Cari / Daftar Pasien'} ],
  dokter:  [ {id:'antrian', label:'Antrian Poli Saya'} ],
  kasir:   [ {id:'tunggu', label:'Menunggu Bayar'}, {id:'lunas', label:'Riwayat Pembayaran'} ],
  admin:   [ {id:'staff', label:'Kelola Staff'}, {id:'obat', label:'Data Obat'}, {id:'laporan', label:'Dashboard'} ],
};
function renderSidebar(){
  const el = document.getElementById('sidebarNav');
  const role = effectiveRole();
  const items = NAVS[role];
  const activeKey = role + 'View';
  el.innerHTML = items.map(it=>{
    const active = ui[activeKey]===it.id;
    return `<button class="nav-item ${active?'active':''}" onclick="setSubView('${it.id}')"><span class="nav-dot"></span>${it.label}</button>`;
  }).join('');
}
function setSubView(id){
  ui[effectiveRole()+'View'] = id;
  ui.activeVisitId = null;
  renderSidebar();
  renderMain();
}

async function renderMain(){
  const el = document.getElementById('mainArea');
  el.innerHTML = '<div class="loading">Memuat data...</div>';
  try{
    const role = effectiveRole();
    if(role==='petugas') el.innerHTML = await renderPetugas();
    if(role==='dokter') el.innerHTML = await renderDokter();
    if(role==='kasir') el.innerHTML = await renderKasir();
    if(role==='admin') el.innerHTML = await renderAdmin();
  }catch(e){
    console.error(e);
    el.innerHTML = '<div class="empty">Gagal memuat data: '+esc(e.message||e)+'</div>';
  }
}

/* =========================================================
   PETUGAS
   ========================================================= */
async function renderPetugas(){
  if(ui.petugasView==='antrian') return await renderPetugasAntrian();
  return await renderPetugasDaftar();
}

async function renderPetugasAntrian(){
  const { data: visits, error } = await sb.from('visits')
    .select('*, patients(nama, no_rm)')
    .eq('tanggal', todayStr())
    .order('no_antrian');
  if(error) throw error;
  cache.visits = visits || [];

  const board = POLI.map(p=>{
    const vs = cache.visits.filter(v=>v.poli_id===p.id);
    const waiting = vs.filter(v=>v.status==='menunggu').length;
    const serving = vs.find(v=>v.status==='dipanggil');
    return `<div class="queue-slot">
      <div class="poli-name">${esc(p.nama)}</div>
      <div class="now-serving">${serving? '#'+serving.no_antrian : '—'}</div>
      <div class="waiting-count">${waiting} pasien menunggu</div>
    </div>`;
  }).join('');

  const rows = cache.visits.filter(v=>v.status!=='selesai').map(v=>{
    const p = poliById(v.poli_id);
    return `<div class="list-row">
      <div class="queue-num mono">${v.no_antrian}</div>
      <div class="row-main">

function filterPatients(q){

function openDaftarKunjungan(patientId){
  daftarState = { patientId };
  document.getElementById('daftarPanel').innerHTML = renderDaftarPanel();
}
async function createPatient(){
  const nama = document.getElementById('newPatNama').value.trim();
  if(!nama){ showToast('Nama pasien wajib diisi'); return; }
  const { count } = await sb.from('patients').select('*', { count:'exact', head:true });
  const no_rm = 'RM-' + String((count||0)+1).padStart(6,'0');
  const payload = {
    no_rm, nama,
    nik: document.getElementById('newPatNik').value || null,
    tgl_lahir: document.getElementById('newPatTgl').value || null,
    jenis_kelamin: document.getElementById('newPatJk').value,
  };
  const { data, error } = await sb.from('patients').insert(payload).select().single();
  if(error){ showToast('Gagal simpan pasien: '+error.message); return; }
  data.patient_allergies = [];
  cache.patients.unshift(data);
  showToast('Pasien baru tersimpan: '+no_rm);
  daftarState.patientId = data.id;
  document.getElementById('daftarPanel').innerHTML = renderDaftarPanel();
  document.getElementById('patientList').innerHTML = renderPatientRows(cache.patients);
}
async function createVisit(){
  const pat = cache.patients.find(p=>p.id===daftarState.patientId);
  const poliId = parseInt(document.getElementById('newVisitPoli').value);
  const keluhan = document.getElementById('newVisitKeluhan').value.trim();
  if(!keluhan){ showToast('Keluhan awal wajib diisi'); return; }

  const { data: existing } = await sb.from('visits').select('no_antrian')
    .eq('poli_id', poliId).eq('tanggal', todayStr()).order('no_antrian', {ascending:false}).limit(1);
  const noAntrian = (existing && existing.length) ? existing[0].no_antrian + 1 : 1;
  const dok = cache.dokters.find(d=>d.poli_id===poliId);

  const { data: visit, error } = await sb.from('visits').insert({
    patient_id: pat.id, poli_id: poliId, dokter_id: dok? dok.id : null,
    no_antrian: noAntrian, status: 'menunggu', keluhan_awal: keluhan, dicatat_oleh: currentStaff.id,
  }).select().single();
  if(error){ showToast('Gagal daftarkan kunjungan: '+error.message); return; }

  const t = parseTensi(document.getElementById('vTensi').value);
  const bt = parseBbTb(document.getElementById('vBbTb').value);
  await sb.from('vital_signs').insert({
    visit_id: visit.id, tensi_sistol: t.sistol, tensi_diastol: t.diastol,
    nadi: parseInt(document.getElementById('vNadi').value)||null,
    suhu: parseFloat(document.getElementById('vSuhu').value)||null,
    berat_badan: bt.bb, tinggi_badan: bt.tb,
  });

  showToast('Nomor antrian '+noAntrian+' diberikan untuk '+poliById(poliId).nama);
  ui.petugasView = 'antrian';
  renderSidebar();
  renderMain();
}

  const poli = poliById(poliId);

  const { data: visits, error } = await sb.from('visits')
    .select('*, patients(nama, patient_allergies(*))')
    .eq('poli_id', poliId).eq('tanggal', todayStr())
    .neq('status','selesai').order('no_antrian');
  if(error) throw error;
  cache.visits = visits || [];

  const rows = cache.visits.map(v=>{
    const hasAllergy = v.patients.patient_allergies && v.patients.patient_allergies.length;

function renderRxList(){
  return cache.currentRxItems.map(r=>`<div class="rx-item"><span class="rx-name">${esc(r.nama_obat)}</span><span>${esc(r.dosis||'')}</span><span>${esc(r.aturan_pakai||'')}</span><span>${esc(r.jumlah||'')}</span></div>`).join('')
    || '<p style="font-size:12.5px;color:var(--ink-faint);">Belum ada resep.</p>';

async function addProcedure(visitId){
  const nama = document.getElementById('procNama').value.trim();
  const biaya = parseInt(document.getElementById('procBiaya').value)||0;
  if(!nama){ showToast('Nama tindakan wajib diisi'); return; }
  const { data, error } = await sb.from('procedures').insert({ visit_id: visitId, nama_tindakan: nama, biaya }).select().single();
  if(error){ showToast('Gagal simpan tindakan: '+error.message); return; }
  cache.currentProcedures.push(data);
  document.getElementById('procList').innerHTML = renderProcList();
  document.getElementById('procNama').value=''; document.getElementById('procBiaya').value='';
}
async function addRx(visitId){
  const obat = document.getElementById('rxObat').value.trim();
  if(!obat){ showToast('Nama obat wajib diisi'); return; }
  if(!cache.currentPrescription){
    const { data, error } = await sb.from('prescriptions').insert({ visit_id: visitId, dokter_id: currentStaff.id }).select().single();
    if(error){ showToast('Gagal membuat resep: '+error.message); return; }
    cache.currentPrescription = data;
  }
  const payload = {
    prescription_id: cache.currentPrescription.id, nama_obat: obat,
    dosis: document.getElementById('rxDosis').value, aturan_pakai: document.getElementById('rxAturan').value,
    jumlah: document.getElementById('rxJumlah').value,
  };
  const { data, error } = await sb.from('prescription_items').insert(payload).select().single();
  if(error){ showToast('Gagal simpan item resep: '+error.message); return; }
  cache.currentRxItems.push(data);
  document.getElementById('rxList').innerHTML = renderRxList();
  document.getElementById('rxObat').value=''; document.getElementById('rxDosis').value='';
  document.getElementById('rxAturan').value=''; document.getElementById('rxJumlah').value='';
}

function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const header = lines[0].split(',').map(h=>h.trim().toLowerCase());
  const idxNama = header.indexOf('nama_obat');
  const idxSatuan = header.indexOf('satuan');
  const idxKategori = header.indexOf('kategori');
  if(idxNama===-1) throw new Error('Kolom "nama_obat" wajib ada di header CSV');
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const cols = lines[i].split(',').map(c=>c.trim());
    const nama = cols[idxNama];
    if(!nama) continue;
    rows.push({
      nama_obat: nama,
      satuan: idxSatuan!==-1 ? (cols[idxSatuan]||null) : null,
      kategori: idxKategori!==-1 ? (cols[idxKategori]||null) : null,
    });
  }
  return rows;
}
async function uploadObatCsv(){
  const fileInput = document.getElementById('csvFile');
  const statusEl = document.getElementById('csvStatus');
  if(!fileInput.files.length){ showToast('Pilih file CSV terlebih dahulu'); return; }
  statusEl.textContent = 'Membaca file...';
  const text = await fileInput.files[0].text();
  let rows;
  try{ rows = parseCsv(text); }
  catch(e){ statusEl.textContent = 'Gagal membaca CSV: '+e.message; return; }
  if(!rows.length){ statusEl.textContent = 'Tidak ada baris data yang valid di file CSV.'; return; }

  const existingNames = new Set(cache.obatAdmin.map(o=>o.nama_obat.toLowerCase()));
  const seen = new Set();
  const toInsert = [];
  let skipped = 0;
  for(const r of rows){
    const key = r.nama_obat.toLowerCase();
    if(existingNames.has(key) || seen.has(key)){ skipped++; continue; }
    seen.add(key);
    toInsert.push(r);
  }
  if(!toInsert.length){ statusEl.textContent = `Semua ${rows.length} obat di file sudah ada di database (dilewati).`; return; }

  statusEl.textContent = `Mengunggah ${toInsert.length} obat baru...`;
  const { data, error } = await sb.from('obat').insert(toInsert).select();
  if(error){ statusEl.textContent = 'Gagal upload: '+error.message; return; }
  statusEl.textContent = `Berhasil: ${data.length} obat baru ditambahkan, ${skipped} dilewati (duplikat).`;
  showToast('Upload CSV selesai: '+data.length+' obat baru ditambahkan');
  fileInput.value = '';
  renderMain();
}

function setLaporanPreset(preset){
  const now = new Date();
  let from, to = todayStr();
  if(preset==='hari'){ from = todayStr(); }
  else if(preset==='minggu'){
    const d = new Date(now); const day = d.getDay()||7;
    d.setDate(d.getDate()-day+1); from = d.toISOString().slice(0,10);
  } else if(preset==='bulan'){
    from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
  } else if(preset==='tahun'){
    from = new Date(now.getFullYear(), 0, 1).toISOString().slice(0,10);
  }
  ui.laporanFrom = from; ui.laporanTo = to;
  renderMain();
}
function applyLaporanRange(){

  if(from > to){ showToast('Tanggal awal tidak boleh setelah tanggal akhir'); return; }
  ui.laporanFrom = from; ui.laporanTo = to;
  renderMain();
}

      <h3>Filter Periode</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <button class="btn btn-ghost btn-sm" onclick="setLaporanPreset('hari')">Hari Ini</button>
        <button class="btn btn-ghost btn-sm" onclick="setLaporanPreset('minggu')">Minggu Ini</button>
        <button class="btn btn-ghost btn-sm" onclick="setLaporanPreset('bulan')">Bulan Ini</button>
        <button class="btn btn-ghost btn-sm" onclick="setLaporanPreset('tahun')">Tahun Ini</button>
      </div>
      <div class="field-row" style="align-items:end;">
        <div class="field" style="margin-bottom:0;"><label>Dari tanggal</label><input type="date" id="filterFrom" value="${from}"></div>
        <div class="field" style="margin-bottom:0;"><label>Sampai tanggal</label><input type="date" id="filterTo" value="${to}"></div>
      </div>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="applyLaporanRange()">Terapkan</button>
    </div>

    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="stat-card"><div class="num">${totalKunjungan||0}</div><div class="label">Total Kunjungan</div></div>
      <div class="stat-card"><div class="num">${fmtRp(pendapatan)}</div><div class="label">Nilai Transaksi (${jumlahTransaksi} transaksi)</div></div>
      <div class="stat-card"><div class="num">${fmtRp(rataRata)}</div><div class="label">Rata-rata per Transaksi</div></div>
    </div>

    <div class="card"><h3>Pasien Dilayani &amp; Pendapatan per Poliklinik</h3><div class="list">${perPoliRows.join('')}</div></div>
  `;
}
</script>
</body>
</html>
